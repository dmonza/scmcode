# cargo-deny policy for scmCode: which licenses Rust dependencies may use.
#
# Run: cargo deny --manifest-path <workspace Cargo.toml> check licenses
# CI runs it for every Rust workspace (.github/workflows/licenses.yml). A dependency under
# a license that is not listed below fails the build until someone reviews it.
#
# Keep `allow` in sync with "allowedLicenses" in scripts/notices/policy.json, which applies
# the same policy to npm packages, Go modules and built-in extensions. The notices generator
# checks that the two lists match.

[graph]
# Dev-dependencies are not shipped.
exclude-dev = true

[licenses]
# Permissive licenses whose conditions THIRD_PARTY_NOTICES.txt satisfies, plus MPL-2.0
# (file-level copyleft: compatible with an MIT project as long as the MPL-covered files are
# used unmodified and their source stays available, which crates.io provides).
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93
# The same list serves three workspaces; not every workspace uses every license.
unused-allowed-license = "allow"
