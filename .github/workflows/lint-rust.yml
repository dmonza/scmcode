name: Lint Rust

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lint-rust.yml"
      - "crates/**"
      - "src-tauri/**"
      - "extensions-rust/**"
      - "sidex-extension-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lint-rust.yml"
      - "crates/**"
      - "src-tauri/**"
      - "extensions-rust/**"
      - "sidex-extension-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0

concurrency:
  group: lint-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      # Pinned: a new stable release adds lints that `-D warnings` turns into
      # errors. Bump on purpose and fix the new lints in the same change.
      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # src-tauri is a workspace member: the target dir is at the repo root.
          workspaces: ". -> target"

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
