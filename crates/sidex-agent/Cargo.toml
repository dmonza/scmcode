[package]
name = "sidex-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AI coding agent tool executor for scmCode"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
regex = { workspace = true }
walkdir = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
memchr = { workspace = true }
sidex-context = { workspace = true }
urlencoding = "2"

# scmCode: the shell tool runs each command in its own process group (Unix) or Job
# Object (Windows) so a timeout or the end of the call kills the whole tree.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10", default-features = false, features = [
  "std",
  "job-object",
  "creation-flags",
] }
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
